<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Action Guardian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z" fill="url(#shieldGrad)" />
          <circle cx="12" cy="13" r="2.5" fill="white" fill-opacity="0.9"/>
          <path d="M12 9.5v1.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="shieldGrad" x1="4" y1="2" x2="20" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1"/>
              <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Action Guardian</span>
      </div>
    </div>
    <div class="header-right">
      <div class="connection-status" id="connectionStatus">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Connecting…</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">

    <!-- Pending Queue -->
    <section class="section" id="pendingSection">
      <div class="section-header">
        <h2 class="section-title">Pending Approval</h2>
        <span class="badge-count" id="pendingCount">0</span>
      </div>
      <div id="pendingCards">
        <!-- Risk cards injected here -->
        <div class="empty-state" id="pendingEmpty">
          <div class="empty-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z" stroke="#6366f1" stroke-width="1.5" fill="none"/>
              <path d="M9 12l2 2 4-4" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <p class="empty-title">All clear</p>
          <p class="empty-sub">Waiting for AI agent actions…</p>
        </div>
      </div>
    </section>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- History -->
    <section class="section" id="historySection">
      <div class="section-header">
        <h2 class="section-title">History</h2>
        <button class="btn-ghost" id="clearHistoryBtn" title="Clear history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
          Clear
        </button>
      </div>
      <div id="historyList">
        <div class="empty-state" id="historyEmpty">
          <p class="empty-sub">No actions yet.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modify Modal -->
  <div class="modal-overlay" id="modifyModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3>Modify Arguments</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <p class="modal-desc">Edit the JSON arguments before approving. Be careful.</p>
      <textarea class="json-editor" id="jsonEditor" spellcheck="false"></textarea>
      <div class="json-error" id="jsonError"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Approve Modified</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
